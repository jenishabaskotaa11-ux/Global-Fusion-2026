<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Global Fusion inquiry notification</title></head>
<body style="font-family:Arial,sans-serif; color:#101A3A; padding:24px;">
<h1 style="font-size:24px;">New Global Fusion 2026 Inquiry</h1>
<p>A visitor has submitted the contact form.</p>
<table style="border-collapse:collapse;"><tbody>
<tr><th style="text-align:left; padding:8px;">Name</th><td>{{from_name}}</td></tr>
<tr><th style="text-align:left; padding:8px;">Email</th><td>{{from_email}}</td></tr>
<tr><th style="text-align:left; padding:8px;">Category</th><td>{{category}}</td></tr>
<tr><th style="text-align:left; padding:8px;">Subject</th><td>{{subject}}</td></tr>
</tbody></table>
<h2 style="font-size:18px;">Message</h2><p style="white-space:pre-wrap;">{{message}}</p>
<p>Reply to this email to respond to the visitor when the template’s Reply-To field is set to {{from_email}}.</p>
</body></html>
