<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="gfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D" />
      <stop offset="50%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FFD60A" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00CFC8" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>
  
  <!-- Icon -->
  <g transform="translate(6, 6)">
    <circle cx="24" cy="24" r="20" fill="url(#gfGrad)" />
    <!-- Rotating cultural rings -->
    <ellipse cx="24" cy="24" rx="23" ry="8" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9" transform="rotate(-25 24 24)" />
    <ellipse cx="24" cy="24" rx="23" ry="8" fill="none" stroke="url(#ringGrad)" stroke-width="2" transform="rotate(35 24 24)" />
    <circle cx="24" cy="24" r="7" fill="#FFFFFF" />
  </g>
  
  <!-- Text -->
  <text x="62" y="28" font-family="'Outfit', 'Syne', sans-serif" font-weight="900" font-size="18" fill="currentColor" letter-spacing="1.5">GLOBAL FUSION</text>
  <text x="63" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#FF7A00" letter-spacing="4">2026</text>
  <rect x="110" y="34" width="48" height="12" rx="3" fill="#00CFC8" fill-opacity="0.2" />
  <text x="134" y="43" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="8" fill="#00CFC8" text-anchor="middle" letter-spacing="1">FESTIVAL</text>
</svg>
