<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="cultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162447" />
      <stop offset="50%" stop-color="#1F4068" />
      <stop offset="100%" stop-color="#E43F5A" />
    </linearGradient>
    <pattern id="cultPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="rgba(255,255,255,0.15)" />
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#cultGrad)" />
  <rect width="800" height="500" fill="url(#cultPattern)" />
  
  <g transform="translate(400, 210)" text-anchor="middle">
    <!-- Mandala / Cultural Ring -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="rgba(255,217,61,0.25)" stroke-width="2" stroke-dasharray="6 4" />
    <circle cx="0" cy="0" r="60" fill="rgba(255,255,255,0.06)" stroke="rgba(255,217,61,0.5)" stroke-width="2" />
    <!-- Folk Icon -->
    <path d="M-20,-20 L20,-20 L30,20 L-30,20 Z" fill="none" stroke="#FFD93D" stroke-width="3" stroke-linejoin="round" />
    <circle cx="0" cy="-5" r="10" fill="#FF4D6D" />
    <path d="M-15,20 L-10,35 M15,20 L10,35" stroke="#FF9F1C" stroke-width="3" stroke-linecap="round" />
  </g>
  
  <text x="400" y="340" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="22" letter-spacing="1">
    CULTURAL HERITAGE PERFORMANCE
  </text>
  <text x="400" y="375" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="14" letter-spacing="2">
    GLOBAL FUSION 2026 &bull; LBEF &amp; APU
  </text>
</svg>
