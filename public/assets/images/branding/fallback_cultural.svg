<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101A3A" />
      <stop offset="50%" stop-color="#3B0764" />
      <stop offset="100%" stop-color="#070B18" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4D6D" />
      <stop offset="50%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FFD60A" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF7A00" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)" />
  <circle cx="400" cy="300" r="240" fill="url(#glowGrad)" />

  <!-- Geometric Cultural Rings Pattern -->
  <g transform="translate(400, 260)" stroke="url(#accentGrad)" fill="none" opacity="0.8">
    <circle cx="0" cy="0" r="100" stroke-width="2.5" />
    <circle cx="0" cy="0" r="70" stroke-width="1.5" stroke-dasharray="6,6" />
    <ellipse cx="0" cy="0" rx="120" ry="40" stroke-width="2" transform="rotate(-30)" />
    <ellipse cx="0" cy="0" rx="120" ry="40" stroke-width="2" transform="rotate(30)" />
    <ellipse cx="0" cy="0" rx="120" ry="40" stroke-width="2" transform="rotate(90)" />
    <!-- Center Emblem -->
    <circle cx="0" cy="0" r="24" fill="url(#accentGrad)" />
  </g>

  <!-- Typography -->
  <text x="400" y="420" font-family="'Outfit', 'Syne', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    GLOBAL FUSION 2026
  </text>
  <text x="400" y="455" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#00CFC8" text-anchor="middle" letter-spacing="3">
    CULTURAL EXPEDITION
  </text>
</svg>
