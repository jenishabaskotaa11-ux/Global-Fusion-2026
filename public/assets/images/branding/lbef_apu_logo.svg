<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220">
  <rect width="720" height="220" fill="white" rx="8" />
  
  <!-- LBEF Section -->
  <g transform="translate(30, 20)">
    <!-- LBEF Letter Blocks -->
    <!-- L -->
    <rect x="0" y="0" width="56" height="88" fill="#00529B" rx="2" />
    <text x="28" y="66" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="62" fill="#FFFFFF" text-anchor="middle">L</text>
    
    <!-- B -->
    <rect x="62" y="0" width="56" height="88" fill="#00529B" rx="2" />
    <text x="90" y="66" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="62" fill="#FFFFFF" text-anchor="middle">B</text>
    
    <!-- E -->
    <rect x="124" y="0" width="56" height="88" fill="#00529B" rx="2" />
    <!-- Stitched style crossbar -->
    <text x="152" y="66" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="62" fill="#FFFFFF" text-anchor="middle">E</text>
    
    <!-- F (Red box) -->
    <rect x="186" y="0" width="104" height="88" fill="#E31B23" rx="2" />
    <text x="216" y="66" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="62" fill="#FFFFFF" text-anchor="middle">F</text>
    <text x="258" y="32" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#FFFFFF" letter-spacing="1">SINCE</text>
    <text x="258" y="58" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="22" fill="#FFFFFF">1998</text>
    
    <!-- COLLEGE Red Banner -->
    <rect x="0" y="94" width="290" height="32" fill="#E31B23" rx="2" />
    <text x="145" y="118" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" letter-spacing="10" text-anchor="middle">COLLEGE</text>
    
    <!-- Underline blue bar -->
    <rect x="0" y="132" width="290" height="3" fill="#00529B" />
    
    <!-- Slogan -->
    <text x="145" y="156" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14.5" fill="#1A1A1A" letter-spacing="1.5" text-anchor="middle">THE FIRST IT COLLEGE OF NEPAL</text>
  </g>
  
  <!-- Divider -->
  <line x1="370" y1="15" x2="370" y2="195" stroke="#444444" stroke-width="2" />
  
  <!-- APU Academic Collaboration Section -->
  <g transform="translate(400, 20)">
    <text x="140" y="24" font-family="'Helvetica Neue', Arial, sans-serif" font-style="italic" font-weight="600" font-size="13" fill="#333333" letter-spacing="1.2" text-anchor="middle">IN ACADEMIC COLLABORATION WITH</text>
    
    <!-- APU Globe with Orbital Rings -->
    <g transform="translate(140, 78)">
      <!-- Globe -->
      <defs>
        <radialGradient id="globeGrad" cx="40%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#4CAF50" />
          <stop offset="50%" stop-color="#2E7D32" />
          <stop offset="90%" stop-color="#1565C0" />
          <stop offset="100%" stop-color="#0D47A1" />
        </radialGradient>
      </defs>
      <circle cx="0" cy="0" r="32" fill="url(#globeGrad)" />
      <!-- Latitude/longitude lines -->
      <ellipse cx="0" cy="0" rx="32" ry="12" fill="none" stroke="#81C784" stroke-width="1.2" opacity="0.8" />
      <ellipse cx="0" cy="0" rx="14" ry="32" fill="none" stroke="#81C784" stroke-width="1.2" opacity="0.8" />
      
      <!-- Gold Orbital Rings -->
      <ellipse cx="0" cy="0" rx="46" ry="16" fill="none" stroke="#FFD600" stroke-width="3" transform="rotate(-30)" />
      <ellipse cx="0" cy="0" rx="46" ry="16" fill="none" stroke="#FFD600" stroke-width="3" transform="rotate(30)" />
      <ellipse cx="0" cy="0" rx="46" ry="16" fill="none" stroke="#FFD600" stroke-width="3" transform="rotate(90)" />
    </g>
    
    <!-- APU Initials -->
    <g transform="translate(140, 134)">
      <text x="-48" y="0" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="28" fill="#1A1A1A" text-anchor="middle">A</text>
      <circle cx="-24" cy="-8" r="3" fill="#E31B23" />
      <text x="0" y="0" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="28" fill="#E31B23" text-anchor="middle">P</text>
      <circle cx="24" cy="-8" r="3" fill="#E31B23" />
      <text x="48" y="0" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="28" fill="#1A1A1A" text-anchor="middle">U</text>
      
      <!-- Underline line -->
      <line x1="-70" y1="8" x2="70" y2="8" stroke="#1A1A1A" stroke-width="1.5" />
    </g>
    
    <!-- APU Full Title -->
    <text x="140" y="156" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11.5" fill="#1A1A1A" letter-spacing="1" text-anchor="middle">ASIA PACIFIC UNIVERSITY</text>
    <text x="140" y="170" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10.5" fill="#1A1A1A" letter-spacing="1" text-anchor="middle">OF TECHNOLOGY &amp; INNOVATION</text>
  </g>
</svg>
